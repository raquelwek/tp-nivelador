services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
    ports:
      - "5678:5678"

  client_1:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_1
    environment:
      - AGENCY_ID=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
    depends_on:
      - server

  client_2:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_2
    environment:
      - AGENCY_ID=2
      - SERVER_HOST=server
      - SERVER_PORT=5678
    depends_on:
      - server

  client_3:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_3
    environment:
      - AGENCY_ID=3
      - SERVER_HOST=server
      - SERVER_PORT=5678
    depends_on:
      - server

  client_4:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_4
    environment:
      - AGENCY_ID=4
      - SERVER_HOST=server
      - SERVER_PORT=5678
    depends_on:
      - server

  client_5:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_5
    environment:
      - AGENCY_ID=5
      - SERVER_HOST=server
      - SERVER_PORT=5678
    depends_on:
      - server
